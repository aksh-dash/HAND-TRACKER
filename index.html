<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Hand Tracking AR</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --bg-color: #050510;
            --text-color: #ffffff;
            --glass-bg: rgba(20, 25, 40, 0.4);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-blur: blur(16px);
            --accent: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
        }

        .zoom-layer {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            will-change: transform; transform-origin: center center;
            /* NO transition for zoom lag removal */
        }

        .input_video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; transform: scaleX(-1); z-index: 0;
            filter: brightness(0.6) contrast(1.1);
        }

        #bgCanvas, #mainCanvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; transform: scaleX(-1);
        }
        #bgCanvas { z-index: 1; pointer-events: none; }
        #mainCanvas { z-index: 5; pointer-events: none; }

        #hud {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            display: flex; flex-direction: column; gap: 15px; pointer-events: none;
        }

        .panel {
            background: var(--glass-bg); backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border); border-radius: 12px;
            padding: 15px 20px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            display: flex; flex-direction: column; gap: 8px; pointer-events: auto;
        }

        .stat {
            display: flex; justify-content: space-between; font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8); min-width: 200px; align-items: center;
        }
        .stat span.val { font-weight: bold; color: var(--accent); }

        .timer-ring {
            width: 20px; height: 20px; border-radius: 50%;
            background: conic-gradient(var(--accent) 0%, transparent 0%);
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: inline-block;
        }

        .pinch-bar {
            position: relative; height: 10px; background: rgba(0,0,0,0.5); 
            border-radius: 5px; overflow: hidden; margin-top: 4px; border: 1px solid rgba(255,255,255,0.1);
        }

        #modes-bar {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            z-index: 10; display: flex; gap: 10px;
            background: var(--glass-bg); backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border); border-radius: 30px; padding: 8px;
        }

        .theme-btn {
            background: transparent; border: 1px solid transparent; color: white;
            padding: 8px 16px; border-radius: 20px; cursor: pointer;
            transition: 0.3s ease; font-weight: 500;
        }
        .theme-btn.active {
            background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.3);
            text-shadow: 0 0 10px white;
        }

        #startOverlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.85); z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            backdrop-filter: blur(10px); transition: opacity 0.5s ease;
        }

        .start-btn {
            padding: 16px 40px; font-size: 1.2rem; background: linear-gradient(45deg, #ffffff, #aaaaaa);
            color: black; border: none; border-radius: 30px; cursor: pointer;
            font-weight: bold; text-transform: uppercase; letter-spacing: 2px; transition: transform 0.2s;
        }
        .start-btn:hover { transform: scale(1.05); }

        .hidden { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

    <div id="startOverlay">
        <h1 style="margin-bottom: 20px; font-weight: 300; letter-spacing: 4px;">NEON AURA AR</h1>
        <p style="margin-bottom: 40px; color: #888;">Grant camera permissions and click to start experience</p>
        <button class="start-btn" id="startBtn">Enter Experience</button>
    </div>

    <div class="zoom-layer" id="zoom-container">
        <video class="input_video" autoplay playsinline></video>
        <canvas id="bgCanvas"></canvas>
        <canvas id="mainCanvas"></canvas>
    </div>

    <div id="hud" class="hidden">
        <div class="panel">
            <div class="stat">Mode: <span class="val" id="ui-mode">Detect</span></div>
            <div class="stat">Hands Detected: <span class="val" id="ui-hands">0</span></div>
            <div class="stat">Render FPS: <span class="val" id="ui-fps">0</span></div>
            <div class="stat">Detect FPS: <span class="val" id="ui-detect-fps">0</span></div>
            <div class="stat">Latency: <span class="val" id="ui-latency">0 ms</span></div>
            <div class="stat">Bridge: <span class="val" id="ui-bridge" style="color:red;">Disconnected</span></div>
        </div>
        <div class="panel">
            <div class="stat">Gesture: <span class="val" id="ui-gesture">None</span></div>
            <div class="stat">Confidence: <span class="val" id="ui-confidence">0%</span></div>
            <div class="stat">Hold Timer: <div class="timer-ring" id="ui-timer-ring"></div></div>
            <div style="margin-top: 8px; font-size: 0.8rem; color: #aaa;">Pinch Meter: <span id="ui-pinch-text" style="color:white; font-weight:bold; margin-left:5px;">OPEN</span></div>
            <div class="pinch-bar">
                <div id="ui-pinch-fill" style="height: 100%; width: 0%; background: #00ffcc; transition: width 0.05s;"></div>
                <div id="ui-pinch-enter" style="position: absolute; top:0; bottom:0; width:2px; background: lime; left: 30%;"></div>
                <div id="ui-pinch-exit" style="position: absolute; top:0; bottom:0; width:2px; background: red; left: 45%;"></div>
            </div>
            <div class="stat" id="ui-zoom-info" style="display:none; margin-top:8px;">Zoom: <span class="val" id="ui-zoom-val">1.0x</span></div>
        </div>
        <div class="panel">
            <label style="font-size:0.9rem; cursor:pointer;"><input type="checkbox" id="ui-show-skeleton" checked> Show Skeleton Overlay</label>
            <label style="font-size:0.9rem; cursor:pointer; margin-top:5px; display:block;"><input type="checkbox" id="ui-debug"> Debug Crosshair</label>
        </div>
    </div>

    <div id="modes-bar" class="hidden">
        <!-- Modes injected dynamically by JS -->
    </div>

    <!-- Main Module -->
    <script type="module" src="./js/main.js"></script>
</body>
</html>
